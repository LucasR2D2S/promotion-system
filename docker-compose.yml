name: promotion-system

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
  RAILS_MAX_THREADS: 3
  # AI provider (see config/initializers/ai.rb). Defaults to Ollama on the host;
  # put overrides and secrets in .env (git-ignored), never in this file.
  AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
  AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
  AI_API_KEY: ${AI_API_KEY:-}

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"   # 3307 on the host avoids clashing with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      target: development
    environment:
      <<: *app-env
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Keep container-built artifacts out of the Windows/macOS bind mount.
      - bundle:/usr/local/bundle
      - tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # built into Docker Desktop; needed on Linux
    stdin_open: true   # allows `docker attach` for the debug gem
    tty: true

volumes:
  mysql_data:
  bundle:
  tmp:
